[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cymple-linux"
version = "0.1.0"
description = "Native Linux runtime for Cymple eye/face trackers: UDP camera ingest and ONNX inference"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8", "onnxruntime>=1.17", "zeroconf>=0.130"]

[project.optional-dependencies]
dev = ["pytest>=8"]
gui = ["PySide6-Essentials>=6.8"]
xr = ["pyopenxr>=1.1.4", "PyOpenGL>=3.1"]          # headset calibration overlay (with gui)

[project.scripts]
cymple-linux = "cymple_linux.cli:main"
opencymple = "cymple_linux.opencymple:main"

[tool.setuptools]
packages = ["cymple_linux", "cymple_linux.outputs", "cymple_linux.ui"]

[tool.setuptools.package-data]
cymple_linux = ["resources/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
