[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencymple-linux"
version = "0.1.0"
description = "Native Linux alternative for Project Cymple"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8", "onnxruntime>=1.17", "zeroconf>=0.130"]

[project.optional-dependencies]
dev = ["pytest>=8"]
gui = ["PySide6-Essentials>=6.8"]
xr = ["pyopenxr>=1.1.4", "PyOpenGL>=3.1"]          # headset calibration overlay (with gui)

[project.scripts]
opencymple-linux = "opencymple.cli:main"
opencymple = "opencymple.opencymple:main"

[tool.setuptools]
packages = ["opencymple", "opencymple.outputs", "opencymple.ui"]

[tool.setuptools.package-data]
opencymple = ["resources/*.svg", "resources/*.qss", "resources/fonts/*", "resources/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
